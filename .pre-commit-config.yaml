repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
    - id: end-of-file-fixer
      # only include python files
      files: \.py$
    - id: trailing-whitespace
      # only include python files
      files: \.py$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.9.9" # Use the appropriate version
    hooks:
    - id: ruff
      args: ["--fix"]
    - id: ruff
      args: ["check", "--select", "I", "--fix"]
    - id: ruff-format

  - repo: local
    hooks:
      - id: no-underscore-md
        name: "Disallow '_' in Markdown filenames"
        language: system
        entry: |
          bash -c '
            # Report the offending files
            echo "[pre-commit] ERROR: Found Markdown files with underscores:" >&2
            for file in "$@"; do
              echo "  - $file (use hyphens instead)" >&2
            done
            exit 1
          '
        files: '.*\/[^\/]*_[^\/]*\.md$'
        exclude: '^\.github/'
        types: [file]

      # task030 Session 2 — unified data registry schema enforcement.
      # Runs whenever a registered registry YAML or its index changes;
      # catches shape drift at commit time before a cluster job hits it.
      # Two-layer validation by design: bridge runtime loaders fail-fast
      # on the first issue (so a single broken row aborts prepare);
      # this hook collects all issues at once for review surface.
      - id: validate-data-registries
        name: "validate unified data registry index"
        language: system
        entry: |
          bash -c '
            PYTHONPATH=src python3 scripts/validate_data_registries.py --quiet
          '
        # Trigger on any change to a registry yaml or the unified
        # index loader / schema itself. The script always validates
        # the *whole* index (no per-file scoping needed).
        files: '^(src/nemotron/recipes/super3/milestones/.*\.(yaml|yml)|scripts/validate_data_registries\.py|src/nemotron/recipes/super3/milestones/data_registries/.*\.py)$'
        pass_filenames: false
        types: [file]

      # task030 Session 6 / task058 follow-up — HF revision-pin gate.
      # Exits 1 if any m0_data_registry row has an unpinned hf_revision
      # (missing or floating ref like main/master/head/latest); informational
      # findings on pref_data_registry candidates are tolerated.
      - id: check-revision-pins
        name: "check HuggingFace revision pins on production data rows"
        language: system
        entry: |
          bash -c '
            PYTHONPATH=src python3 scripts/validate_data_registries.py --check-revision-pins >/dev/null
          '
        files: '^(src/nemotron/recipes/super3/milestones/.*\.(yaml|yml)|scripts/validate_data_registries\.py|src/nemotron/recipes/super3/milestones/data_registries/.*\.py)$'
        pass_filenames: false
        types: [file]

      # task030 Session 7 / task058 follow-up — contamination_against
      # semantic gate. Exits 1 if any m0_data_registry row has a broken
      # contamination_against field (empty list, non-list, non-string /
      # empty-string entries); placeholder-only rows (["TBD"] etc.)
      # surface as informational and don't fail CI.
      - id: check-contamination
        name: "check contamination_against fields on production data rows"
        language: system
        entry: |
          bash -c '
            PYTHONPATH=src python3 scripts/validate_data_registries.py --check-contamination >/dev/null
          '
        files: '^(src/nemotron/recipes/super3/milestones/.*\.(yaml|yml)|scripts/validate_data_registries\.py|src/nemotron/recipes/super3/milestones/data_registries/.*\.py)$'
        pass_filenames: false
        types: [file]
