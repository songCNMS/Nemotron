# RLHF data preparation
#
# Splits the bridge combined.jsonl into train/val using the sibling
# manifest.json counts.val boundary.
# No placeholder resolution needed.
#
# Usage:
#   nemotron super3 data prep rl rlhf
#   nemotron super3 data prep rl rlhf val_holdout=<N> input_path=/path/to/manual.jsonl

# M0-derived combined JSONL from the RLHF bridge.
input_path: ${oc.env:NEMO_RUN_DIR,.}/output/super3/m1_rlhf/combined.jsonl

# Output directory
output_dir: ${oc.env:PWD}/../output/super3/stage2_rl/rlhf

# Infer the bridge validation row count from sibling manifest.json counts.val.
# Override with an integer for manual/non-bridge JSONL inputs.
val_holdout: auto

# Limit rows per dataset for quick tests (null = no limit)
sample: null

# Force new run, ignoring cache
force: false
