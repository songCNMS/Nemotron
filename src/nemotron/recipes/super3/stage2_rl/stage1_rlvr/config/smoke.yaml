run:
  data: super3/rl/rlvr1/data:latest
  model: super3-sft-model:latest
  env:
    container: nvcr.io/nvidia/nemo-rl:v0.5.0.nemotron_3_super

defaults: "default.yaml"

# RLVR Stage 1 smoke config (task014 Session 2).
#
# Smallest possible cluster footprint that still exercises the full
# rollout / training loop end-to-end. Use to verify that the M0 → bridge
# → data_prep → RLVR1 pipeline is wired correctly before committing to a
# multi-node small.yaml or production small.yaml run.
#
# Usage:
#   nemotron super3 rl rlvr1 -c smoke --run YOUR-CLUSTER
#
# Smoke vs small.yaml deltas:
#   - 2 nodes vs 21
#   - 8 prompts/step vs 128
#   - 2 generations/prompt vs 8
#   - 4 train global batch vs 1024
#   - Few steps (max_num_steps: 10) so the run completes in minutes
#     not hours
#   - val_at_end=true so the smoke run produces a regression-style
#     report against the small val set
#
# Real launch needs cluster + checkpoint + NeMo-Gym judge services —
# sandbox verification covers config-syntax + structural shape only.

checkpointing:
  enabled: true
  checkpoint_dir: "results/super_v3_prod_stage1_rlvr_smoke"

grpo:
  num_prompts_per_step: 8
  num_generations_per_prompt: 2
  num_val_generations_per_prompt: 1
  max_num_steps: 10
  val_at_start: false
  val_at_end: true
  val_batch_size: 8

policy:
  train_global_batch_size: 4
  generation:
    colocated:
      resources:
        num_nodes: 1
    vllm_cfg:
      tensor_parallel_size: 1
    vllm_kwargs:
      max_num_seqs: 4
  megatron_cfg:
    expert_model_parallel_size: 2

env:
  nemo_gym:
    genrm_model:
      responses_api_models:
        vllm_model:
          router_dp_size: 1
          server_args:
            max_num_seqs: 4
    nl2bash_judge_model:
      responses_api_models:
        vllm_model:
          router_dp_size: 1
          server_args:
            max_num_seqs: 4
    safety_judge_model:
      responses_api_models:
        vllm_model:
          server_args:
            max_num_seqs: 4

cluster:
  num_nodes: 2
