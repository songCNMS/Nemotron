run:
  env:
    container: anyscale/ray:2.49.2-py312

# RLVR Stage 1.3 data preparation
#
# `input_path` points at the M0-derived combined.jsonl produced by
# the M1 RLVR bridge (`prepare_m1_rlvr_jsonl.py --mix rlvr3`). This is
# the intended data-prep contract even while current registry coverage
# may have no active rlvr3 rows; unblock the bridge coverage rather
# than running a developer-local release file as a default.
#
# Usage:
#   nemotron super3 data prep rl rlvr -c rlvr3

# M0-derived combined JSONL from the bridge. Override this path only if
# the bridge wrote rlvr3 output to a different directory.
input_path: ${oc.env:NEMO_RUN_DIR,.}/output/super3/m1_rlvr/rlvr3/combined.jsonl

# Output directory
output_dir: ${oc.env:NEMO_RUN_DIR,.}/output/super3/stage2_rl/rlvr3

# Infer validation holdout from sibling manifest.json counts.val.
# Override with an integer for manual/non-bridge JSONL inputs.
val_holdout: auto

# Limit rows per dataset for quick tests (null = no limit)
sample: null

# Force new run, ignoring cache
force: false
