run:
  env:
    container: anyscale/ray:2.49.2-py312

# RLVR Stage 1.2 data preparation
#
# `input_path` points at the M0-derived combined.jsonl produced by
# the M1 RLVR bridge (`prepare_m1_rlvr_jsonl.py --mix rlvr2`). The
# bridge writes train.jsonl + val.jsonl + combined.jsonl plus
# manifest/report/fingerprint lineage.
#
# Usage:
#   nemotron super3 data prep rl rlvr -c rlvr2

# M0-derived combined JSONL from the bridge. Override this path only if
# the bridge wrote rlvr2 output to a different directory.
input_path: ${oc.env:NEMO_RUN_DIR,.}/output/super3/m1_rlvr/rlvr2/combined.jsonl

# Output directory
output_dir: ${oc.env:PWD}/../output/super3/stage2_rl/rlvr2

# Number of rows to hold out for validation (from end of file)
val_holdout: 100

# Limit rows per dataset for quick tests (null = no limit)
sample: null

# Force new run, ignoring cache
force: false
