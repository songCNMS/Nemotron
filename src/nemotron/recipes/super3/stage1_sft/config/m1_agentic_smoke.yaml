run:
  train_script: src/nemotron/recipes/super3/stage1_sft/test_train.py
  data: null
  model: null
  env:
    container: nvcr.io/nvidia/nemo:26.02.nemotron_3_super
    nodes: 1
    gpus_per_node: 1
    ntasks_per_node: 1

# Local smoke config for M1 Agentic SFT packed data. It intentionally avoids
# artifact references so direct script execution can validate data loading before
# a real pretrain checkpoint artifact is available.
artifacts:
  wandb: false
  manifest:
    root: null

dataset:
  super3_packed_sft_dir: ${oc.env:SUPER3_M1_AGENTIC_PACKED_DIR,../output/super3/stage1_sft_agentic_v0/splits}
  seq_length: 4096
  packed_sequence_specs:
    packed_sequence_size: 4096

# Must match the tokenizer that produced the packed parquet shards
# (see config/data_prep/agentic_v0.yaml). Mixing tokenizers between data prep
# and training silently reinterprets the input_ids.
tokenizer:
  tokenizer_model: ${oc.env:SUPER3_M1_TOKENIZER_MODEL,nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16}

train:
  train_iters: 1
  global_batch_size: 1
  micro_batch_size: 1

scheduler:
  lr_warmup_iters: 0

logger:
  log_interval: 1
  wandb_project: null
  wandb_entity: null

checkpoint:
  save: ${oc.env:SUPER3_M1_SFT_SMOKE_SAVE,../output/super3/m1_agentic_sft_smoke/checkpoints}
  load: null
  save_interval: 1
  # Smoke runs with finetune=false train from random init, so no pretrain
  # checkpoint is involved. Use a literal YAML null — `${oc.env:VAR,null}` would
  # yield the literal string "null", and the env-var-only form `${oc.env:VAR}`
  # would raise MissingMandatoryValue when train.py:367 logs the field even
  # though finetune=false means it's unused downstream.
  pretrained_checkpoint: null
  finetune: false

convert_to_hf:
  enabled: false
  # Match default.yaml / m1_agentic_train.yaml — convention is the `-Base-` HF id.
  hf_model_id: "nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-Base-BF16"
