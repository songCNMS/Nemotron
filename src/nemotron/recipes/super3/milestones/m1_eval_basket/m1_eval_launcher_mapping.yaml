# NeMo Evaluator launcher task mapping for the M1 eval basket.
#
# Verified against nemo-evaluator-launcher==0.2.5 on NemTron during
# task071 Session 3. Keep this file separate from the benchmark registry:
# registry rows describe the intended M1 acceptance basket, while this file
# records the concrete launcher task names currently available to execute.
#
# Rows with status=missing are intentionally not substituted with unrelated
# benchmarks. They must be mapped only when an equivalent launcher task exists.

