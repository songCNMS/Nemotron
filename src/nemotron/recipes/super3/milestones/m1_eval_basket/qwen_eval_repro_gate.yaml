invalid_task_findings:
  - finding_id: legacy_mmlu_pro_completions_short_parser_mismatch
    benchmark_id: mmlu_pro
    issue_types:
      - completions_only
      - short_generation_capped
      - parser_misaligned
    invalid_reason: |
      Legacy MMLU-Pro used completions with max_gen_toks=32 while prompting for
      step-by-step reasoning; 12030/12032 original responses were invalid under
      the old parser. This cannot count as Qwen-chat reproduction.
    required_remediation: Use /v1/chat/completions with JSON answer-only prompt, max_tokens=64, and the chat JSON answer-key parser.

  - finding_id: legacy_aime25_short_generation_parser_mismatch
    benchmark_id: aime25
    issue_types:
      - short_generation_capped
      - parser_misaligned
    invalid_reason: |
      Legacy AIME25 used 2048 generation tokens; 234/300 rows ended by length
      and many outputs never reached a boxed answer. The score mixes model
      ability with generation budget and final-answer contract failure.
    required_remediation: Use /v1/chat/completions with 8192 max tokens and a scorer-compatible boxed or normalized final-answer parser.

  - finding_id: legacy_hmmt_short_generation_parser_mismatch
    benchmark_id: hmmt
    issue_types:
      - short_generation_capped
      - parser_misaligned
    invalid_reason: |
      Legacy HMMT used 2048 generation tokens; 28/30 rows ended by length and
      only two predicted-answer rows were available to the symbolic scorer.
    required_remediation: Use /v1/chat/completions with at least 4096/8192 max tokens and the symbolic final-answer parser.

