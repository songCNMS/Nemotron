      - curl -sS --connect-timeout 2 --max-time 4 http://127.0.0.1:30000/v1/models
    observed_at_utc: "2026-05-25T03:53:38Z"
    observed_result: connection refused on ports 13000 and 30000
    impact: |
      Could not run a fresh live base-Qwen endpoint smoke from this worktree.
      The gate therefore records the existing smallest Qwen chat-completions
      reproduction smoke and the exact endpoint blocker for PM/runtime follow-up.
  - blocker_id: endpoint_inventory_has_no_qwen_surface
    status: blocked_in_available_endpoint_inventory
    probe_commands:
      - awk 'NF && $1 !~ /^#/ {print $2}' /work-agents/endpoints.txt | grep -i qwen || true
      - awk 'NF && $1 !~ /^#/ {print $2}' /work-agents/endpoints.txt | grep -ci qwen || true
    observed_at_utc: "2026-05-25T04:14:00Z"
    observed_result: 10 active endpoint rows checked; qwen_endpoint_hits=0
    impact: |
      `/work-agents/endpoints.txt` lists reachable non-Qwen model surfaces only.
      No listed endpoint can serve as a fresh base-Qwen smoke target without
      provisioning a new Qwen endpoint or remote forward.
