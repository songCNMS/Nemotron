    prompt_contract: original AIME25 math prompt, temperature=0.0, top_p=1e-5
    parser: exact_normalized_boxed_or_symbolic_parser
    final_answer_format: boxed final answer or scorer-normalized numeric answer
    min_max_generation_tokens: 8192
