invalid_legacy_eval_surfaces:
  - finding_id: legacy_mmlu_pro_completions_short_parser_mismatch
    benchmark_id: mmlu_pro
    issue_types:
      - completions_only
      - short_generation_capped
      - parser_misaligned
    invalid_reason: |
      The legacy MMLU-Pro launcher path used /v1/completions with max_gen_toks=32
      while prompting for step-by-step reasoning; most outputs were invalid under
      the old parser.
    required_remediation: Use /v1/chat/completions, JSON answer-only prompting, max_tokens=64, checked summary/results artifacts, and explicit corrected deltas.

  - finding_id: legacy_aime25_short_cap_parser_mismatch
    benchmark_id: aime25
    issue_types:
      - short_generation_capped
      - parser_misaligned
    invalid_reason: |
      The legacy AIME25 math path used 2048 generation tokens and mixed model
      quality with length caps and missing boxed/final-answer parses.
    required_remediation: Use the corrected math protocol with /v1/chat/completions, max_tokens=8192, exact-normalized parser, checked artifacts, and baseline/current deltas.

  - finding_id: legacy_hmmt_short_cap_parser_mismatch
    benchmark_id: hmmt
    issue_types:
      - short_generation_capped
      - parser_misaligned
    invalid_reason: |
      The legacy HMMT path used 2048 generation tokens and only a small number
      of symbolic predicted-answer rows reached the scorer.
    required_remediation: Use the corrected math protocol with /v1/chat/completions, max_tokens=8192, symbolic final-answer parser, checked artifacts, and baseline/current deltas.

  - finding_id: open_pr_sidecar_or_targeted_smoke_context_not_countable
    benchmark_id: qwen_sidecar_context
    issue_types:
      - missing_raw_artifact
      - open_pr_context_only
      - targeted_smoke_only
      - missing_baseline_delta
    invalid_reason: |
      task075/task076 evidence is still in open PR context and includes targeted
      smoke or sidecar audit records that are not repo-local merged benchmark
      artifacts with full baseline/current deltas.
    required_remediation: Merge the evidence, record checked raw artifact paths, and add full corrected MMLU-Pro/AIME25/HMMT baseline/current deltas before counting as improvement evidence.

  - finding_id: m2_config_only_without_frozen_baselines
    benchmark_id: m2_eval_basket
    issue_types:
      - config_only_no_frozen_baseline
      - missing_baseline_delta
    invalid_reason: |
      M2 basket rows are still config-only and do not have frozen Qwen3.5-122B
      baseline values or live benchmark artifacts in this repo.
    required_remediation: Add frozen baselines, checked raw artifacts, and full live eval deltas before using M2 rows as benchmark improvement evidence.

context_only_records:
  - source: PR #182 task075_qwen_v8_export_eval
    count_as_improvement_evidence: false
    reason: |
      V8 corrected metrics and AIME row audit are useful context, but the task075
      refs are not all on main. They must not be counted by this ledger until
      merged and artifact-checked.
  - source: PR #183 task076_qwen_v9_aime_recurrence_tuning
    count_as_improvement_evidence: false
    reason: |
      V9 targeted AIME06 smoke is useful diagnostic context, not a full corrected
      MMLU-Pro/AIME25/HMMT gate with baseline/current deltas.
