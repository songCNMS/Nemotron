schema_version: 1
ledger_id: task079_qwen_benchmark_alignment_s1
recorded_at_utc: "2026-05-28T00:00:00Z"
base_sha: ffcf0ae247400f1da8f4b0a20e32e4d2c6393795
description: |
  Repo-local benchmark alignment ledger for Qwen gate evidence. The basket
  configs and registries define target coverage; this ledger defines which
  AIME25/HMMT/MMLU-Pro artifacts can count as benchmark improvement evidence.
  Evidence must use the Qwen chat-completions route, parser-compatible final
  answer format, adequate generation budget, checked raw artifacts, and an
  explicit baseline/current delta.

target_suites:
  - suite_id: m1_v0_basket_gate_targets
    milestone: M1
    gate_usage: target_acceptance_basket
    source_config: src/nemotron/recipes/super3/stage3_eval/config/m1_basket.yaml
    registry_paths:
      - src/nemotron/recipes/super3/milestones/m1_eval_basket/m1_eval_basket_registry.yaml
    benchmark_ids:
      - mmlu_pro
      - aime25
      - gpqa
      - livecodebench
      - ifbench
      - multichallenge
      - ruler_256k
      - taubench_airline
    evidence_policy:
      accepts_improvement_evidence: false
      reason: |
        Basket membership alone is not enough. MMLU-Pro and AIME25 require the
        corrected Qwen evidence protocol below before a run can count as
        benchmark improvement evidence.

  - suite_id: m1_full_basket_target
    milestone: M1
    gate_usage: target_acceptance_basket
    source_config: src/nemotron/recipes/super3/stage3_eval/config/m1_full_basket.yaml
    registry_paths:
      - src/nemotron/recipes/super3/milestones/m1_eval_basket/m1_eval_basket_registry.yaml
      - src/nemotron/recipes/super3/milestones/m1_eval_basket/m1_eval_full_basket_registry.yaml
    benchmark_ids:
      - mmlu_pro
      - aime25
      - hmmt
      - gpqa
      - hle
      - livecodebench
      - scicode
      - ifbench
      - multichallenge
      - ruler_256k
      - aa_lcr
      - taubench_airline
      - terminalbench
      - bfcl
      - mcp_mark
      - tool_decathlon
      - swe_bench_verified
      - mmlu_prox
      - wmt24pp
    evidence_policy:
      accepts_improvement_evidence: false
      reason: |
        This is the exact M1 target set. Countable Qwen improvement evidence for
        MMLU-Pro/AIME25/HMMT must be recorded under
        m1_qwen_corrected_improvement_subset.

  - suite_id: m1_full_basket_launcher_available
    milestone: M1
    gate_usage: runnable_regression_subset
    source_config: src/nemotron/recipes/super3/stage3_eval/config/m1_full_basket_launcher_available.yaml
    registry_paths:
      - src/nemotron/recipes/super3/milestones/m1_eval_basket/m1_eval_launcher_mapping.yaml
    benchmark_ids:
      - mmlu_pro
      - aime25
      - hmmt
      - gpqa
      - hle
      - livecodebench
      - scicode
      - ifbench
      - ruler_256k
      - aa_lcr
      - taubench_airline
      - bfcl
      - mmlu_prox
      - wmt24pp
    missing_benchmark_ids:
      - multichallenge
      - terminalbench
      - swe_bench_verified
      - mcp_mark
      - tool_decathlon
    evidence_policy:
      accepts_improvement_evidence: false
      reason: |
        Launcher availability is useful for regression sweeps, but the legacy
        MMLU-Pro/AIME25/HMMT launcher metrics remain parser/budget sensitive.
        They cannot be promoted as Qwen benchmark improvement evidence without
        the corrected records below.

  - suite_id: m1_qwen_corrected_improvement_subset
    milestone: M1
    gate_usage: qwen_benchmark_improvement_gate
    source_config: src/nemotron/recipes/super3/stage3_eval/config/m1_corrected_math_comparison.yaml
    registry_paths:
      - src/nemotron/recipes/super3/milestones/m1_eval_basket/qwen_eval_repro_gate.yaml
      - src/nemotron/recipes/super3/milestones/m1_eval_basket/qwen_benchmark_alignment_ledger.yaml
    benchmark_ids:
      - mmlu_pro
      - aime25
      - hmmt
    evidence_policy:
      accepts_improvement_evidence: true
      requires_chat_completions: true
      requires_raw_artifacts: true
      requires_baseline_delta: true
      rejects_issue_types:
        - completions_only
        - short_generation_capped
        - parser_misaligned
        - missing_raw_artifact

  - suite_id: m2_eval_basket_config_only
    milestone: M2
    gate_usage: config_only_gate
    source_config: src/nemotron/recipes/super3/milestones/m2_eval_basket/m2_eval_basket_registry.yaml
    registry_paths:
      - src/nemotron/recipes/super3/milestones/m2_eval_basket/m2_eval_basket_registry.yaml
      - src/nemotron/recipes/super3/milestones/m2_eval_basket/m2_eval_adapter_config.yaml
      - src/nemotron/recipes/super3/milestones/m2_eval_basket/m2_eval_gap_thresholds.yaml
    benchmark_ids:
      - hle
      - browsecomp
      - bird_real_execution
      - bfcl_full
      - mcp_mark
      - tool_decathlon
      - multilingual_ifeval
      - multilingual_humaneval
    evidence_policy:
      accepts_improvement_evidence: false
      reason: |
        M2 rows are still config-only: live assets, cluster runtimes, and frozen
        Qwen3.5-122B-A10B baselines are not present in the repo. They define gate
        scope but cannot count as benchmark improvements.

benchmark_protocols:
  - benchmark_id: mmlu_pro
    suite_id: m1_qwen_corrected_improvement_subset
    endpoint_type: openai_chat_completions
    route: /v1/chat/completions
    endpoint_url_shape: http://127.0.0.1:13000/v1/chat/completions
    prompt_contract: chat JSON answer-only prompt, temperature=0.0, top_p=1e-5
    parser: chat_json_answer_key_exact_match
    final_answer_format: JSON object with answer key only
    min_max_generation_tokens: 64
    accepted_max_generation_tokens: 64
    raw_artifact_requirements:
      - summary.json
      - results.jsonl
    invalid_legacy_issue_types:
      - completions_only
      - short_generation_capped
      - parser_misaligned
      - missing_raw_artifact

