schema_version: 1
milestone: M0
description: M0 NeMo-Gym-compatible reward environment registry for smoke and small-run validation.
environments:
  - id: search_grounded_qa
    family: search
    stage: M0 data_env_foundation
    input_schema: nemo_gym_jsonl
    reward:
      verifier: normalized_exact_or_contains
      range: [0.0, 1.0]
      success_threshold: 1.0
      semantics: answer must match the expected short answer after normalization
    resources:
      sandbox: none
      tools:
        - static_retrieval_context
      timeout_s: 20
      max_turns: 2
      expected_runtime_ms: 500
    telemetry:
      - reward
      - latency_ms
      - normalized_answer
      - context_doc_count
      - timeout
    health_check:
      min_rows_per_split: 25
      required_fields:
        - question
        - expected_answer
        - extra_env_info.context_documents

  - id: search_multihop_qa
    family: search
    stage: M0 data_env_foundation
    input_schema: nemo_gym_jsonl
    reward:
      verifier: normalized_exact_or_contains
      range: [0.0, 1.0]
      success_threshold: 1.0
      semantics: answer must match the expected short answer (or any answer_aliases entry) after normalization
    resources:
      sandbox: none
      tools:
        - static_retrieval_context
      timeout_s: 30
      max_turns: 4
      expected_runtime_ms: 800
    telemetry:
      - reward
      - latency_ms
      - normalized_answer
      - supporting_doc_count
      - hop_count
      - timeout
    health_check:
      min_rows_per_split: 25
      required_fields:
        - question
        - expected_answer
        - extra_env_info.context_documents
        - extra_env_info.supporting_titles

  - id: browser_qa
    family: browser_search
    stage: M2 browser/search scaffold
    input_schema: nemo_gym_jsonl
    reward:
      verifier: browser_grounded_answer_stub
      range: [0.0, 1.0]
      success_threshold: 1.0
      semantics: sandbox stub checks normalized final-answer containment; future cluster verifier must validate browser trace grounding and citations
    resources:
      sandbox: playwright_chromium_cluster_deferred
      tools:
        - browser_search
        - browser_open
        - browser_find
        - browser_cite
      timeout_s: 180
      max_turns: 8
      expected_runtime_ms: 30000
    telemetry:
      - reward
      - latency_ms
      - grounded_answer_match
      - citation_url_count
      - browser_trace_present
      - timeout
    health_check:
      min_rows_per_split: 10
      required_fields:
        - question
        - expected_answer
        - extra_env_info.seed_urls

  - id: browsecomp_grounded
    family: browser_search
    stage: M2 browser/search scaffold
    input_schema: nemo_gym_jsonl
    reward:
      verifier: browser_grounded_answer_stub
      range: [0.0, 1.0]
      success_threshold: 1.0
      semantics: sandbox stub checks normalized final-answer containment for BrowseComp-style questions; future cluster verifier must run browser/search and validate evidence pages
    resources:
      sandbox: playwright_chromium_cluster_deferred
      tools:
        - browser_search
        - browser_open
        - browser_find
        - browser_cite
      timeout_s: 240
      max_turns: 10
      expected_runtime_ms: 45000
    telemetry:
      - reward
      - latency_ms
      - grounded_answer_match
      - citation_url_count
      - browser_trace_present
      - timeout
    health_check:
      min_rows_per_split: 10
      required_fields:
        - question
        - expected_answer
        - extra_env_info.seed_urls
        - extra_env_info.cluster_execution

  - id: code_execution_python
    family: coding
    stage: M0 data_env_foundation
    input_schema: nemo_gym_jsonl
    reward:
      verifier: python_unit_tests
      range: [0.0, 1.0]
      success_threshold: 1.0
      semantics: submitted Python solution must pass the provided tests
    resources:
      sandbox: python_subprocess_or_container
      tools:
        - run_python_tests
      timeout_s: 30
      max_turns: 3
      expected_runtime_ms: 2000
    telemetry:
      - reward
      - tests_passed
      - tests_total
      - latency_ms
      - timeout
      - runtime_error
    health_check:
      min_rows_per_split: 25
      required_fields:
        - question
        - expected_answer
        - extra_env_info.test_list

  - id: terminal_basic_shell
    family: terminal
    stage: M0 data_env_foundation
    input_schema: nemo_gym_jsonl
    reward:
      verifier: command_substring_match
      range: [0.0, 1.0]
      success_threshold: 1.0
      semantics: emitted shell command must contain the expected command after lightweight normalization
    resources:
      sandbox: none
      tools:
        - shell_command_prompt
      timeout_s: 20
      max_turns: 1
      expected_runtime_ms: 500
    telemetry:
      - reward
      - command_match
      - latency_ms
      - unsafe_command_flag
    health_check:
      min_rows_per_split: 25
      required_fields:
        - question
        - expected_answer
        - extra_env_info.expected_command

  - id: terminal_workplace
    family: terminal
    stage: M2 terminalbench scaffold
    input_schema: nemo_gym_jsonl
    reward:
      verifier: command_substring_match
      range: [0.0, 1.0]
      success_threshold: 1.0
      semantics: Session 1 scaffold reuses normalized command substring matching; future cluster verifier executes TerminalBench workplace tasks in a terminal sandbox
    resources:
      sandbox: terminal
      tools:
        - shell_command_prompt
        - terminal_workspace
      timeout_s: 300
      max_turns: 4
      expected_runtime_ms: 60000
    telemetry:
      - reward
      - command_match
      - timeout_s
      - timeout_profile
      - latency_ms
      - unsafe_command_flag
    health_check:
      min_rows_per_split: 10
      required_fields:
        - question
        - expected_answer
        - extra_env_info.expected_command
        - extra_env_info.extended_timeout_s

  - id: swe_pivot_patch_supervision
    family: software_engineering
    stage: M0 data_env_foundation
    input_schema: nemo_gym_jsonl
    reward:
      verifier: patch_diff_match
      range: [0.0, 1.0]
      success_threshold: 1.0
      semantics: emitted unified diff must match the gold patch after newline normalization
    resources:
      sandbox: none
      tools:
        - unified_diff_patch
      timeout_s: 20
      max_turns: 1
      expected_runtime_ms: 500
    telemetry:
      - reward
      - patch_match
      - latency_ms
      - malformed_diff
    health_check:
      min_rows_per_split: 20
      required_fields:
        - question

  - id: swe_pivot_tool_call
    family: software_engineering
    stage: M0 data_env_foundation
    input_schema: nemo_gym_jsonl
    reward:
      verifier: argument_match
      range: [0.0, 1.0]
      success_threshold: 1.0
      semantics: emitted first tool call (name + arguments) must match the gold pivot call
    resources:
      sandbox: none
      tools:
        - view_file
        - search
        - edit_file
        - run_tests
      timeout_s: 10
      max_turns: 1
      expected_runtime_ms: 300
    telemetry:
      - reward
      - tool_name_match
      - tool_argument_match
      - latency_ms
      - malformed_tool_call
    health_check:
      min_rows_per_split: 20
      required_fields:
        - question
        - expected_answer
        - extra_env_info.gold_tool_call

  - id: safety_reasoning_smoke
    family: safety
    stage: M0 data_env_foundation
    input_schema: nemo_gym_jsonl
    reward:
      verifier: safety_judge_stub
      range: [0.0, 1.0]
      success_threshold: 1.0
      semantics: M0 oracle baseline uses case-insensitive contains-match on the canonical verdict (allow / block / escalate); real judge-model scoring is M2 task029 territory
    resources:
      sandbox: none
      tools: []
      timeout_s: 15
      max_turns: 1
      expected_runtime_ms: 1000
    telemetry:
      - reward
      - verdict_match
      - latency_ms
      - malformed_verdict
    health_check:
      min_rows_per_split: 20
      required_fields:
        - question
        - expected_answer
        - extra_env_info.verdict

  - id: sql_text_to_query
    family: structured_query
    stage: M0 data_env_foundation
    input_schema: nemo_gym_jsonl
    reward:
      verifier: sql_execution_match
      range: [0.0, 1.0]
      success_threshold: 1.0
      semantics: M0 oracle baseline uses normalized SQL string match; real execution against a DB sandbox is M2 task024 territory
    resources:
      sandbox: sql_sqlite
      tools:
        - sqlite3
      timeout_s: 10
      max_turns: 1
      expected_runtime_ms: 500
    telemetry:
      - reward
      - sql_match
      - sql_execution_mode
      - latency_ms
      - malformed_sql
    health_check:
      min_rows_per_split: 20
      required_fields:
        - question
        - expected_answer
        - extra_env_info.db_id

  - id: long_context_qa_smoke
    family: long_context
    stage: M0 data_env_foundation
    input_schema: nemo_gym_jsonl
    reward:
      verifier: long_context_qa_stub
      range: [0.0, 1.0]
      success_threshold: 1.0
      semantics: gold answer must appear in the candidate (normalized contains-match) over a 16K-32K char document context
    resources:
      sandbox: none
      tools: []
      timeout_s: 30
      max_turns: 1
      expected_runtime_ms: 5000
    telemetry:
      - reward
      - contains_match
      - doc_length_chars
      - latency_ms
      - malformed_answer
    health_check:
      min_rows_per_split: 20
      required_fields:
        - question
        - expected_answer
        - extra_env_info.doc_length_chars

  - id: rlhf_toolcall_paired
    family: rlhf_preference
    stage: M0 data_env_foundation
    input_schema: nemo_gym_jsonl
    reward:
      verifier: argument_match
      range: [0.0, 1.0]
      success_threshold: 1.0
      semantics: emitted first tool call (name + arguments) must match the gold pivot call paired to this preference prompt
    resources:
      sandbox: none
      tools:
        - "<varies per row — Hermes function schema attached>"
      timeout_s: 10
      max_turns: 1
      expected_runtime_ms: 300
    telemetry:
      - reward
      - tool_name_match
      - tool_argument_match
      - latency_ms
      - malformed_tool_call
    health_check:
      min_rows_per_split: 20
      required_fields:
        - question
        - expected_answer
        - extra_env_info.source_helpsteer2_id
        - extra_env_info.source_hermes_id

  - id: multilingual_instruct
    family: multilingual
    stage: M0 data_env_foundation
    input_schema: nemo_gym_jsonl
    reward:
      verifier: multilingual_exact_or_contains
      range: [0.0, 1.0]
      success_threshold: 1.0
      semantics: emitted response normalized per Unicode + lowercase must exact-or-contains the gold target
    resources:
      sandbox: none
      tools: []
      timeout_s: 10
      max_turns: 1
      expected_runtime_ms: 500
    telemetry:
      - reward
      - exact_match
      - contains_match
      - latency_ms
      - malformed_answer
    health_check:
      min_rows_per_split: 20
      required_fields:
        - question
        - expected_answer
        - extra_env_info.language

  - id: helpsteer2_pref_compare
    family: rlhf_preference
    stage: M0 data_env_foundation
    input_schema: nemo_gym_jsonl
    reward:
      verifier: genrm_compare
      range: [0.0, 1.0]
      success_threshold: 1.0
      semantics: GenRM judge compares the policy's completion vs the candidate identified by preference_label
    resources:
      sandbox: none
      tools: []
      timeout_s: 30
      max_turns: 1
      expected_runtime_ms: 2000
    telemetry:
      - reward
      - preference_label_match
      - judge_confidence
      - latency_ms
    health_check:
      min_rows_per_split: 20
      required_fields:
        - question
        - expected_answer
        - extra_env_info.completion_a
        - extra_env_info.completion_b
        - extra_env_info.preference_label

  - id: swe2_openhands_trace
    family: software_engineering
    stage: M0 data_env_foundation
    input_schema: nemo_gym_jsonl
    reward:
      verifier: openhands_loop
      range: [0.0, 1.0]
      success_threshold: 1.0
      semantics: emitted patch must apply AND test suite must pass in the SIF sandbox (binary reward)
    resources:
      sandbox: sif
      tools:
        - view_file
        - search
        - edit_file
        - run_shell
        - run_tests
        - submit_patch
      timeout_s: 3600
      max_turns: 200
      expected_runtime_ms: 600000
    telemetry:
      - reward
      - patch_applies
      - tests_pass
      - trajectory_turns
      - latency_ms
      - sandbox_violations
    health_check:
      min_rows_per_split: 20
      required_fields:
        - question
        - expected_answer
        - extra_env_info.gold_patch
        - extra_env_info.reference_trajectory
        - extra_env_info.sif_source
        - expected_answer
        - extra_env_info.repo
        - extra_env_info.gold_patch

  - id: general_tool_calling
    family: general_tool_calling
    stage: M0 data_env_foundation
    input_schema: nemo_gym_jsonl
    reward:
      verifier: tool_schema_and_argument_match
      range: [0.0, 1.0]
      success_threshold: 1.0
      semantics: emitted tool name and JSON arguments must match the reference call
    resources:
      sandbox: none
      tools:
        - openai_function_schema
      timeout_s: 20
      max_turns: 2
      expected_runtime_ms: 500
    telemetry:
      - reward
      - invalid_tool_call
      - schema_error
      - argument_match
      - latency_ms
    health_check:
      min_rows_per_split: 25
      required_fields:
        - responses_create_params.tools
        - extra_env_info.expected_tool_calls

  - id: multi_turn_tool_use
    family: general_tool_calling
    stage: M0 data_env_foundation
    input_schema: nemo_gym_jsonl
    reward:
      verifier: tool_schema_and_argument_match
      range: [0.0, 1.0]
      success_threshold: 1.0
      semantics: emitted tool name + JSON arguments must match the reference trajectory across the entire multi-turn run
    resources:
      sandbox: none
      tools:
        - openai_function_schema
      timeout_s: 60
      max_turns: 10
      expected_runtime_ms: 1500
    telemetry:
      - reward
      - invalid_tool_call
      - schema_error
      - argument_match
      - tool_call_id_pairing_match
      - turn_count
      - latency_ms
    health_check:
      min_rows_per_split: 25
      required_fields:
        - responses_create_params.tools
        - extra_env_info.expected_tool_calls
        - extra_env_info.expected_trajectory

  - id: tool_call_repair_negative
    family: general_tool_calling
    stage: M0 data_env_foundation
    input_schema: nemo_gym_jsonl
    reward:
      verifier: negative_recognition
      range: [0.0, 1.0]
      success_threshold: 1.0
      semantics: response must repair a malformed or hallucinated tool-use artifact to the reference tool call
    resources:
      sandbox: none
      tools:
        - openai_function_schema
      timeout_s: 20
      max_turns: 2
      expected_runtime_ms: 500
    telemetry:
      - reward
      - negative_kind
      - repair_target_match
      - invalid_tool_call
      - latency_ms
    health_check:
      min_rows_per_split: 25
      required_fields:
        - responses_create_params.tools
        - metadata.negative_kind
        - metadata.repair_target
        - extra_env_info.repair_target

  - id: structured_outputs_json
    family: structured_output
    stage: M0 data_env_foundation
    input_schema: nemo_gym_jsonl
    reward:
      verifier: json_value_exact_match
      range: [0.0, 1.0]
      success_threshold: 1.0
      semantics: emitted JSON must parse and match the reference JSON structure and values
    resources:
      sandbox: none
      tools:
        - json_schema_prompt
      timeout_s: 20
      max_turns: 1
      expected_runtime_ms: 500
    telemetry:
      - reward
      - json_parse_error
      - schema_error
      - exact_value_match
      - latency_ms
    health_check:
      min_rows_per_split: 25
      required_fields:
        - question
        - expected_answer
        - extra_env_info.schema
        - extra_env_info.expected_json

  - id: math_reasoning_numeric
    family: reasoning
    stage: M0 data_env_foundation
    input_schema: nemo_gym_jsonl
    reward:
      verifier: normalized_numeric_exact_match
      range: [0.0, 1.0]
      success_threshold: 1.0
      semantics: final numeric answer must match after comma and whitespace normalization
    resources:
      sandbox: none
      tools: []
      timeout_s: 20
      max_turns: 1
      expected_runtime_ms: 500
    telemetry:
      - reward
      - normalized_answer
      - latency_ms
      - malformed_final_answer
    health_check:
      min_rows_per_split: 25
      required_fields:
        - question
        - expected_answer
        - responses_create_params.input

  - id: math_competition_numeric
    family: reasoning
    stage: M0 data_env_foundation
    input_schema: nemo_gym_jsonl
    reward:
      verifier: normalized_exact_or_contains
      range: [0.0, 1.0]
      success_threshold: 1.0
      semantics: candidate must include the expected boxed answer after normalization (smoke verifier — production needs a math-judge)
    resources:
      sandbox: none
      tools: []
      timeout_s: 30
      max_turns: 1
      expected_runtime_ms: 800
    telemetry:
      - reward
      - normalized_answer
      - boxed_answer_extracted
      - solution_token_count
      - latency_ms
      - malformed_final_answer
    health_check:
      min_rows_per_split: 25
      required_fields:
        - question
        - expected_answer
        - responses_create_params.input
        - extra_env_info.reference_solution

  - id: math_with_tools
    family: reasoning
    stage: M0 data_env_foundation
    input_schema: nemo_gym_jsonl
    reward:
      verifier: math_with_tools_match
      range: [0.0, 1.0]
      success_threshold: 1.0
      semantics: |
        M0 oracle stub — extracts the candidate's last `\boxed{...}` and
        compares against gold after lowercase + whitespace-collapsed
        normalization. Falls back to whole-candidate contains-match when
        no `\boxed{...}` is present. Real Python-execution + math-judge
        scoring is M1 task011 territory; the `_match` suffix signals
        the M0 stub intent.
    resources:
      sandbox: none
      tools: []
      timeout_s: 30
      max_turns: 1
      expected_runtime_ms: 1500
    telemetry:
      - reward
      - normalized_answer
      - boxed_answer_extracted
      - has_code_block_in_candidate
      - latency_ms
      - malformed_final_answer
    health_check:
      min_rows_per_split: 25
      required_fields:
        - question
        - expected_answer
        - extra_env_info.reference_solution
        - extra_env_info.has_code_block

  - id: math_formal_lean
    family: reasoning
    stage: M0 data_env_foundation
    input_schema: nemo_gym_jsonl
    reward:
      verifier: lean_proof_stub
      range: [0.0, 1.0]
      success_threshold: 1.0
      semantics: |
        M0 smoke verifier — candidate is rewarded 1.0 if the emitted proof
        is non-empty after strip. Real Lean compiler verification (run the
        proof against mathlib4 + check `#print axioms` is clean) requires
        the Lean toolchain inside a sandbox container and is task017 /
        task049 territory.
    resources:
      sandbox: lean_toolchain_or_none
      tools: []
      timeout_s: 30
      max_turns: 1
      expected_runtime_ms: 800
    telemetry:
      - reward
      - nonempty_proof
      - proof_length
      - language
      - latency_ms
    health_check:
      # No data_registry source pinned yet — math_formal_lean is awaiting
      # legal/share-alike clearance per docs/m0-dataset-expansion-plan.md §6
      # Q1. When a source is approved (Nemotron-Math-Proofs-v1 if CC-BY-SA
      # is cleared, or mathlib4-extraction / LeanDojo-Bench as permissive
      # alternatives), this row stays as-is; only a data_registry.yaml
      # entry is added.
      min_rows_per_split: 25
      required_fields:
        - question
        - expected_answer
        - responses_create_params.input
        - extra_env_info.statement_only
        - extra_env_info.reference_proof
