schema_version: 1
milestone: M0
description: Public M0 data registry for search, coding, terminal basics, SWE patches, tool repair, structured output, general tool calling, and reasoning smoke sets.
datasets:
  - id: m0_search_hotpotqa
    environment: search_grounded_qa
    domain: search
    hf_dataset: hotpotqa/hotpot_qa
    hf_config: distractor
    hf_split: train
    hf_val_split: validation
    hf_revision: 1908d6afbbead072334abe2965f91bd2709910ab
    source_url: https://huggingface.co/datasets/hotpotqa/hotpot_qa
    license: cc-by-sa-4.0
    # hotpotqa/hotpot_qa ships a custom HF loader script. `datasets>=2.16`
    # refuses to execute it unless trust_remote_code is set explicitly.
    trust_remote_code: true
    converter: hotpotqa_search
    default_train_rows: 100
    default_val_rows: 25
    difficulty: mixed
    reward_type: normalized_exact_or_contains
    contamination: decontaminate against held-out QA and search eval baskets before training scale-up
    use_stage:
      - M0 data_env_foundation
      - M1 RLVR search/browser retrieval smoke
      - M2 browser/search expansion
    fields:
      id: id
      question: question
      answer: answer
      context: context
      difficulty: level

  - id: m0_coding_mbpp
    environment: code_execution_python
    domain: coding
    hf_dataset: google-research-datasets/mbpp
    hf_config: full
    hf_split: train
    hf_val_split: validation
    hf_revision: 4bb6404fdc6cacfda99d4ac4205087b89d32030c
    source_url: https://huggingface.co/datasets/google-research-datasets/mbpp
    license: cc-by-4.0
    converter: mbpp_code_execution
    default_train_rows: 100
    default_val_rows: 25
    difficulty: intro_python
    reward_type: python_unit_tests
    contamination: decontaminate against LiveCodeBench, HumanEval, MBPP eval, and internal coding evals
    use_stage:
      - M0 data_env_foundation
      - M1 RLVR code execution smoke
      - M1 SWE-RL preflight
    fields:
      id: task_id
      prompt: text
      reference_code: code
      tests: test_list
      imports: test_setup_code

  - id: m0_terminal_bash_commands
    environment: terminal_basic_shell
    domain: terminal
    hf_dataset: aelhalili/bash-commands-dataset
    hf_config: default
    hf_split: train
    hf_revision: 67a539a9c6358574fe4f22e126cba3421fff4645
    source_url: https://huggingface.co/datasets/aelhalili/bash-commands-dataset
    license: mit
    converter: bash_command
    default_train_rows: 100
    default_val_rows: 25
    difficulty: basic_shell
    reward_type: command_substring_match
    contamination: decontaminate against TerminalBench and held-out shell command evals
    use_stage:
      - M0 data_env_foundation
      - M1 Agentic SFT v0 terminal basics
      - M1 RLVR terminal smoke
      - M2 TerminalBench expansion
    fields:
      prompt: prompt
      response: response

  - id: m0_swe_patch_lite
    environment: swe_pivot_patch_supervision
    domain: software_engineering
    hf_dataset: princeton-nlp/SWE-bench_Lite
    hf_config: default
    hf_split: test
    hf_val_split: dev
    hf_revision: 6ec7bb89b9342f664a54a6e0a6ea6501d3437cc2
    source_url: https://huggingface.co/datasets/princeton-nlp/SWE-bench_Lite
    license: source-repository-specific
    converter: swe_bench_patch
    default_train_rows: 100
    default_val_rows: 20
    difficulty: repo_issue_patch
    reward_type: patch_diff_match
    contamination: exclude from SWE-Bench Lite and SWE-Bench Verified eval baskets when used for training
    use_stage:
      - M0 data_env_foundation
      - M1 Agentic SFT v0 short SWE traces
      - M1 SWE-RL preflight
      - M2 SWE multi-harness expansion
    fields:
      id: instance_id
      repo: repo
      base_commit: base_commit
      problem_statement: problem_statement
      patch: patch
      test_patch: test_patch

  - id: m0_tool_calling_hermes
    environment: general_tool_calling
    domain: general_tool_calling
    hf_dataset: NousResearch/hermes-function-calling-v1
    # Hermes ships multiple configs (func_calling_singleturn, func_calling,
    # glaive_func_calling, json_mode_singleturn, json_mode_agentic). Without an
    # explicit config, `load_dataset` is ambiguous on this dataset. M0 targets
    # the single-turn function-calling subset because the `general_tool_calling`
    # environment registry currently runs with max_turns=2. Multi-turn config
    # (`func_calling`) is reserved for M1 when the agent loop is wired up.
    hf_config: func_calling_singleturn
    hf_split: train
    # NousResearch/hermes-function-calling-v1 does not ship train/val splits per
    # config — there is only `train`. We intentionally leave hf_val_split unset
    # so prepare_m0_assets falls back to its sequential-slice path and records
    # the "not a true holdout" warning in manifest.warnings. This is the same
    # signal the README surfaces.
    hf_revision: dae3e1d28cfbcf4b915c04ea1e072030529b4bda
    source_url: https://huggingface.co/datasets/NousResearch/hermes-function-calling-v1
    license: apache-2.0
    converter: hermes_function_calling
    default_train_rows: 100
    default_val_rows: 25
    difficulty: mixed
    reward_type: tool_schema_and_argument_match
    contamination: decontaminate against BFCL, TauBench, tool-use heldouts, and internal tool schemas
    use_stage:
      - M0 data_env_foundation
      - M1 Agentic SFT v0 tool syntax
      - M1 RLVR tool-call smoke
      - M2 tool-use expansion
    fields:
      id: id
      conversations: conversations
      tools: tools
      category: category
      subcategory: subcategory

  - id: m0_tool_call_repair_negative_hermes
    environment: tool_call_repair_negative
    domain: general_tool_calling
    hf_dataset: NousResearch/hermes-function-calling-v1
    hf_config: func_calling_singleturn
    hf_split: train
    hf_revision: dae3e1d28cfbcf4b915c04ea1e072030529b4bda
    source_url: https://huggingface.co/datasets/NousResearch/hermes-function-calling-v1
    license: apache-2.0
    converter: hermes_tool_call_repair_negative
    default_train_rows: 100
    default_val_rows: 25
    difficulty: mixed
    reward_type: negative_recognition
    contamination: decontaminate against BFCL, TauBench, tool repair heldouts, and internal tool schemas
    use_stage:
      - M0 data_env_foundation
      - M1 Agentic SFT v0 tool repair negatives
      - M1 RLVR tool-call repair smoke
      - M2 tool-use expansion
    fields:
      id: id
      conversations: conversations
      tools: tools
      category: category
      subcategory: subcategory

  - id: m0_structured_outputs_hermes_json
    environment: structured_outputs_json
    domain: structured_output
    hf_dataset: NousResearch/hermes-function-calling-v1
    hf_config: json_mode_singleturn
    hf_split: train
    # Same source/revision/license family as the function-calling subset above.
    # The dataset only ships a train split for this config, so val rows use the
    # sequential-slice fallback and manifest warning.
    hf_revision: dae3e1d28cfbcf4b915c04ea1e072030529b4bda
    source_url: https://huggingface.co/datasets/NousResearch/hermes-function-calling-v1
    license: apache-2.0
    converter: hermes_json_mode
    default_train_rows: 100
    default_val_rows: 25
    difficulty: mixed
    reward_type: json_value_exact_match
    contamination: decontaminate against structured-output, JSON-mode, BFCL, and tool-use heldouts
    use_stage:
      - M0 data_env_foundation
      - M1 Agentic SFT v0 structured output
      - M1 RLVR structured output smoke
      - M2 tool-use expansion
    fields:
      id: id
      conversations: conversations
      schema: schema
      category: category
      subcategory: subcategory

  - id: m0_reasoning_gsm8k
    environment: math_reasoning_numeric
    domain: reasoning
    hf_dataset: openai/gsm8k
    hf_config: main
    hf_split: train
    hf_val_split: test
    hf_revision: 740312add88f781978c0658806c59bc2815b9866
    source_url: https://huggingface.co/datasets/openai/gsm8k
    license: mit
    converter: gsm8k_numeric_reasoning
    default_train_rows: 100
    default_val_rows: 25
    difficulty: grade_school_math
    reward_type: normalized_numeric_exact_match
    contamination: decontaminate against GSM8K eval and broader math benchmark baskets
    use_stage:
      - M0 data_env_foundation
      - M1 RLVR math/reasoning smoke
      - M2 harder reasoning curriculum
    fields:
      question: question
      answer: answer
