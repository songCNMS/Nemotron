schema_version: 1
milestone: M0
description: Public M0 data registry for search, coding, general tool calling, and reasoning smoke sets.
datasets:
  - id: m0_search_hotpotqa
    environment: search_grounded_qa
    domain: search
    hf_dataset: hotpotqa/hotpot_qa
    hf_config: distractor
    hf_split: train
    hf_val_split: validation
    hf_revision: 1908d6afbbead072334abe2965f91bd2709910ab
    source_url: https://huggingface.co/datasets/hotpotqa/hotpot_qa
    license: cc-by-sa-4.0
    # hotpotqa/hotpot_qa ships a custom HF loader script. `datasets>=2.16`
    # refuses to execute it unless trust_remote_code is set explicitly.
    trust_remote_code: true
    converter: hotpotqa_search
    default_train_rows: 100
    default_val_rows: 25
    difficulty: mixed
    reward_type: normalized_exact_or_contains
    contamination: decontaminate against held-out QA and search eval baskets before training scale-up
    use_stage:
      - M0 data_env_foundation
      - M1 RLVR search/browser retrieval smoke
      - M2 browser/search expansion
    fields:
      id: id
      question: question
      answer: answer
      context: context
      difficulty: level

  - id: m0_coding_mbpp
    environment: code_execution_python
    domain: coding
    hf_dataset: google-research-datasets/mbpp
    hf_config: full
    hf_split: train
    hf_val_split: validation
    hf_revision: 4bb6404fdc6cacfda99d4ac4205087b89d32030c
    source_url: https://huggingface.co/datasets/google-research-datasets/mbpp
    license: cc-by-4.0
    converter: mbpp_code_execution
    default_train_rows: 100
    default_val_rows: 25
    difficulty: intro_python
    reward_type: python_unit_tests
    contamination: decontaminate against LiveCodeBench, HumanEval, MBPP eval, and internal coding evals
    use_stage:
      - M0 data_env_foundation
      - M1 RLVR code execution smoke
      - M1 SWE-RL preflight
    fields:
      id: task_id
      prompt: text
      reference_code: code
      tests: test_list
      imports: test_setup_code

  - id: m0_tool_calling_hermes
    environment: general_tool_calling
    domain: general_tool_calling
    hf_dataset: NousResearch/hermes-function-calling-v1
    # Hermes ships multiple configs (func_calling_singleturn, func_calling,
    # glaive_func_calling, json_mode_singleturn, json_mode_agentic). Without an
    # explicit config, `load_dataset` is ambiguous on this dataset. M0 targets
    # the single-turn function-calling subset because the `general_tool_calling`
    # environment registry currently runs with max_turns=2. Multi-turn config
    # (`func_calling`) is reserved for M1 when the agent loop is wired up.
    hf_config: func_calling_singleturn
    hf_split: train
    # NousResearch/hermes-function-calling-v1 does not ship train/val splits per
    # config — there is only `train`. We intentionally leave hf_val_split unset
    # so prepare_m0_assets falls back to its sequential-slice path and records
    # the "not a true holdout" warning in manifest.warnings. This is the same
    # signal the README surfaces.
    hf_revision: dae3e1d28cfbcf4b915c04ea1e072030529b4bda
    source_url: https://huggingface.co/datasets/NousResearch/hermes-function-calling-v1
    license: apache-2.0
    converter: hermes_function_calling
    default_train_rows: 100
    default_val_rows: 25
    difficulty: mixed
    reward_type: tool_schema_and_argument_match
    contamination: decontaminate against BFCL, TauBench, tool-use heldouts, and internal tool schemas
    use_stage:
      - M0 data_env_foundation
      - M1 Agentic SFT v0 tool syntax
      - M1 RLVR tool-call smoke
      - M2 tool-use expansion
    fields:
      id: id
      conversations: conversations
      tools: tools
      category: category
      subcategory: subcategory

  - id: m0_search_musique
    environment: search_multihop_qa
    domain: search
    hf_dataset: dgslibisey/MuSiQue
    # MuSiQue ships a single default config (Ans subset variant). We pin a
    # revision so the downloaded loader / row layout cannot drift mid-run.
    hf_config: null
    hf_split: train
    hf_val_split: validation
    hf_revision: cf7a59f47c11b51c3b5d0a39bc24c54a48d80b0d
    source_url: https://huggingface.co/datasets/dgslibisey/MuSiQue
    license: cc-by-4.0
    converter: musique_search
    default_train_rows: 100
    default_val_rows: 25
    difficulty: multi_hop_2_to_4_hops
    reward_type: normalized_exact_or_contains
    contamination: decontaminate against MuSiQue eval and held-out multi-hop QA baskets
    use_stage:
      - M0 data_env_foundation
      - M1 RLVR multi-hop search smoke
      - M2 browser/search expansion
    fields:
      id: id
      question: question
      answer: answer
      paragraphs: paragraphs
      supporting: paragraphs.is_supporting

  - id: m0_tool_calling_hermes_multi
    environment: multi_turn_tool_use
    domain: general_tool_calling
    hf_dataset: NousResearch/hermes-function-calling-v1
    # Multi-turn `func_calling` config (vs the singleturn config used by
    # m0_tool_calling_hermes). `transform_hermes_function_calling` already
    # captures multi-turn `expected_trajectory` via task002's fix, so the
    # converter is shared; only the env_id and `max_turns` differ.
    hf_config: func_calling
    hf_split: train
    # Like func_calling_singleturn, this config ships only `train`; the
    # prepare script falls back to sequential val-slice with a manifest
    # warning (task001 fix).
    hf_revision: dae3e1d28cfbcf4b915c04ea1e072030529b4bda
    source_url: https://huggingface.co/datasets/NousResearch/hermes-function-calling-v1
    license: apache-2.0
    converter: hermes_function_calling
    default_train_rows: 100
    default_val_rows: 25
    difficulty: multi_turn_tool_use
    reward_type: tool_schema_and_argument_match
    contamination: decontaminate against BFCL multi-turn, TauBench, and internal tool schemas
    use_stage:
      - M0 data_env_foundation
      - M1 Agentic SFT v0 multi-turn tool trace
      - M1 RLVR multi-turn tool-call smoke
      - M2 tool-use expansion
    fields:
      id: id
      conversations: conversations
      tools: tools
      category: category
      subcategory: subcategory

  - id: m0_reasoning_gsm8k
    environment: math_reasoning_numeric
    domain: reasoning
    hf_dataset: openai/gsm8k
    hf_config: main
    hf_split: train
    hf_val_split: test
    hf_revision: 740312add88f781978c0658806c59bc2815b9866
    source_url: https://huggingface.co/datasets/openai/gsm8k
    license: mit
    converter: gsm8k_numeric_reasoning
    default_train_rows: 100
    default_val_rows: 25
    difficulty: grade_school_math
    reward_type: normalized_numeric_exact_match
    contamination: decontaminate against GSM8K eval and broader math benchmark baskets
    use_stage:
      - M0 data_env_foundation
      - M1 RLVR math/reasoning smoke
      - M2 harder reasoning curriculum
    fields:
      question: question
      answer: answer

  - id: m0_math_numinamath
    environment: math_competition_numeric
    domain: reasoning
    hf_dataset: AI-MO/NuminaMath-CoT
    hf_config: null
    hf_split: train
    hf_val_split: test
    hf_revision: d5fbeac4a1ad8e3ff32024e29bff4f2b3ab74e7c
    source_url: https://huggingface.co/datasets/AI-MO/NuminaMath-CoT
    license: apache-2.0
    converter: numinamath_competition
    default_train_rows: 100
    default_val_rows: 25
    difficulty: competition_math_mixed
    reward_type: normalized_exact_or_contains
    # NuminaMath-CoT is built from MATH, AMC/AIME, cn_k12, olympiads etc.
    # `decontaminate against` here is non-negotiable for any M1+ eval using
    # the corresponding benchmarks; M0 smoke uses it only for wiring verification.
    contamination: decontaminate against MATH, AIME-24/25, AMC, AMC-10/12, HMMT, GSM8K eval baskets
    use_stage:
      - M0 data_env_foundation
      - M1 RLVR competition math smoke
      - M2 harder reasoning curriculum
    fields:
      problem: problem
      solution: solution
      source: source
